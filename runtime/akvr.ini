; Batman: Arkham Knight VR - starting configuration.
; Place next to BatmanAK.exe. The Insert menu rewrites this file when it closes.

[DIBR]
; Headset output on. F5 toggles it at runtime.
XREnabled=1
StereoOn=1
; Complete-frame same-frame stereo is the verified mode. DIBR is a leftover experiment.
SameFrameStereo=1
DIBREnabled=0
DepthDebug=0
SubmitHeadPose=1

[AER]
; Eye offset per eye in Unreal units. Arkham is ~50 uu/m, so 1.6 is about a 64 mm IPD.
HalfEye=1.600000
; Complete-frame mode maps pass 0 -> left eye; 0 is the correct polarity for it.
SwapEyes=0
DisplayHz=0

[SixDof]
Gameplay=1

[Tracking]
YawGain=1.000000
PitchGain=1.000000
Smoothing=0.000000
InvertYaw=0
InvertPitch=0

[Controls]
; Virtual-key code for recenter. 36 = Home.
RecenterKey=36

[FovFill]
; Leave off: widening FOV after Arkham has culled the scene causes zoom and geometry pop-in.
Enabled=0
